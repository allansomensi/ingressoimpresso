[package]
name = "ingressoimpresso-server"
description = "Ingresso Impresso HTTP API (Axum + PostgreSQL), export worker included."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ingressoimpresso"
path = "src/main.rs"

[features]
default = []
# TypeScript bindings for the API DTOs (generated by `cargo test --features ts`).
ts = ["dep:ts-rs", "ticket-render/ts"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hex.workspace = true
image.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
ticket-core = { workspace = true, features = ["fast", "signing", "serde"] }
ticket-render.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize.workspace = true

[dev-dependencies]
http-body-util.workspace = true
image.workspace = true
rqrr.workspace = true
tower.workspace = true
zip.workspace = true

[lints]
workspace = true
