[package]
name = "ii-cli"
description = "Development and admin tooling for Ingresso Impresso (test vectors, local rendering, keys)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ii"
path = "src/main.rs"

[features]
default = []
# TypeScript bindings for the vectors file schema (generated by `cargo test --features ts`).
ts = ["dep:ts-rs", "ticket-core/ts"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
curve25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ticket-core = { workspace = true, features = ["fast", "signing", "serde"] }
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
