[package]
name = "ticket-wasm"
description = "WebAssembly bindings of ticket-core for the door app: verification and decision only, never signing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde.workspace = true
serde-wasm-bindgen.workspace = true
# Deliberately without the `signing` feature: private keys must not be compilable into the door app.
ticket-core = { workspace = true, features = ["serde"] }
wasm-bindgen.workspace = true

# Same as [workspace.lints], except `unsafe_code`: wasm-bindgen's generated glue needs `unsafe`
# and uses `#[allow(unsafe_code)]`, which `forbid` would reject. Hand-written code stays safe.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
