[package]
name = "ticket-core"
description = "Ticket QR format v1, Ed25519 signatures and the door check-in decision. Pure: no IO, no clock, no randomness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Ed25519 precomputed tables: faster signing/verification, larger binary. Enabled by the server/CLI.
fast = ["ed25519-dalek/fast"]
# Ticket issuing (private keys). Never enabled in the WebAssembly build.
signing = []
# Wire DTOs (door manifest, decisions) with serde.
serde = ["dep:serde", "dep:hex"]
# TypeScript bindings for the wire DTOs (generated by `cargo test --features ts`).
ts = ["serde", "dep:ts-rs"]

[dependencies]
ed25519-dalek.workspace = true
hex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "properties"
required-features = ["signing"]

[[test]]
name = "vectors"
required-features = ["signing", "serde"]

[lints]
workspace = true
