[package]
name = "ticket-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.ticket-core]
path = ".."
features = ["signing", "serde"]

# Its own workspace: the fuzz crate is never built by `just check` (it needs nightly) and must
# not join the root workspace's lints and lockfile.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "door"
path = "fuzz_targets/door.rs"
test = false
doc = false
bench = false
