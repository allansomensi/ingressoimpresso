# Render Blueprint (ADRs 0013, 0019): API in Virginia, next to Neon aws-us-east-1.
#
# `sync: false` values are asked only when the Blueprint is first created. After that they live in
# the dashboard (service → Environment) and a Blueprint sync never overwrites them. A key added here
# later is not asked for: set it by hand in the dashboard too.
services:
  - type: web
    name: ingressoimpresso-api
    runtime: docker
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    region: virginia
    plan: starter
    branch: main
    # Deploy only commits whose GitHub checks (CI with the door e2e) passed.
    autoDeployTrigger: checksPass
    # Only changes that affect the API image trigger a (long) Rust build.
    buildFilter:
      paths:
        - crates/server/**
        - crates/render/**
        - crates/ticket-core/**
        - .sqlx/**
        - .cargo/**
        - Cargo.toml
        - Cargo.lock
        - deploy/api.Dockerfile
        - .dockerignore
      ignoredPaths:
        - crates/**/tests/**
    # Liveness only: it does not touch Postgres, so an idle Neon compute can scale to zero.
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TICKET_KEY_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # ADR 0020 (docs/deploy.md §5.1): optional pair; without it an admin marks batches as paid.
      - key: PUBLIC_WEB_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ADR 0029 (docs/deploy.md §5.2): optional; turns on "Entrar com Google".
      - key: GOOGLE_CLIENT_ID
        sync: false
      # ADR 0041 (docs/deploy.md §5.4): optional; delivery statuses in the e-mail panel.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # ADR 0042 (docs/deploy.md §5.5): optional; automatic review of uploaded art.
      - key: MODERATION_VISION_API_KEY
        sync: false
      # ADR 0044 (docs/deploy.md §5.6): optional, both or neither; anti-bot check of login codes.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # The test environment (ADR 0046, docs/deploy.md §11): the same image from the staging branch,
  # with its own Neon branch, keys and domain. The free plan sleeps when idle (the first request
  # after a pause takes about a minute), which is fine for tests.
  - type: web
    name: ingressoimpresso-api-staging
    runtime: docker
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    region: virginia
    plan: free
    branch: staging
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - crates/server/**
        - crates/render/**
        - crates/ticket-core/**
        - .sqlx/**
        - .cargo/**
        - Cargo.toml
        - Cargo.lock
        - deploy/api.Dockerfile
        - .dockerignore
      ignoredPaths:
        - crates/**/tests/**
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      # Leaves room in the shared Resend quota for production's codes.
      - key: MAIL_DAILY_LIMIT
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: TICKET_KEY_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
