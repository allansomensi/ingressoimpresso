# Dependency updates as pull requests (one batch a week each), so a locked version that gains an
# advisory is noticed and fixed, and the actions the workflows run stay current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Updating Typst is a planned task (CLAUDE.md): templates and tests go with it.
      - dependency-name: "typst*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 and ESLint 10 wait for typescript-eslint and eslint-config-next (CLAUDE.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    ignore:
      # The build image's Rust must match rust-toolchain.toml: both move together, by hand.
      - dependency-name: rust
