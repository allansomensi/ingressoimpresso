name: Deploy web

# ADR 0009: the Vercel build has no Rust, so the door's WebAssembly is compiled here and the
# site is uploaded prebuilt. The CI workflow calls this one as its last job on a push to main
# (production) or staging (the test environment, ADR 0046: a preview built with the staging
# branch's Preview variables, aliased to its own domain), so like the API on Render nothing
# reaches people before the checks pass (ADR 0047), and the job runs on the pushed branch, which
# the GitHub Environments check. A manual run deploys any branch as a preview (or production, from
# main). Needs the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets of the Production,
# Staging and Preview environments (docs/deploy.md); without them the job only warns.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      production:
        description: "Production deploy (main only); otherwise a preview URL"
        type: boolean
        default: false

permissions:
  contents: read

# bash with pipefail: a failing `vercel deploy` must fail the job.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: vercel deploy --prebuilt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The VERCEL_* secrets live in GitHub Environments (ADR 0047): Production (branch main),
    # Staging (branch staging) and Preview (manual previews of any other branch).
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || github.ref_name == 'staging' && 'Staging' || 'Preview' }}
    concurrency:
      group: deploy-web-${{ github.ref_name }}
      cancel-in-progress: false
    # Job level, so the environment's secrets are the ones read (a reusable workflow gets no env
    # from its caller either).
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_CLI: vercel@59.26.0
      # Previews get a fixed address, so the API's ALLOWED_ORIGINS can list it once.
      PREVIEW_ALIAS: ${{ vars.VERCEL_PREVIEW_ALIAS || 'ingressoimpresso-preview.vercel.app' }}
      # The staging site's address (a domain added to the Vercel project, not assigned to production).
      STAGING_ALIAS: ${{ vars.VERCEL_STAGING_ALIAS || 'staging.ingressoimpresso.com.br' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (docs/deploy.md) to deploy the web app."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - name: Rust toolchain
        if: steps.secrets.outputs.ready == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.secrets.outputs.ready == 'true'

      - name: Install just and wasm-bindgen-cli
        if: steps.secrets.outputs.ready == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.129

      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build the door WebAssembly
        if: steps.secrets.outputs.ready == 'true'
        run: just wasm

      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Called by CI (event "push") on main, or asked for by hand from main.
          PRODUCTION: ${{ github.ref_name == 'main' && (github.event_name == 'push' || inputs.production) }}
          STAGING: ${{ github.ref_name == 'staging' }}
        run: |
          target=preview
          prod=()
          branch=()
          alias="$PREVIEW_ALIAS"
          if [ "$PRODUCTION" = "true" ]; then
            target=production
            prod=(--prod)
          elif [ "$STAGING" = "true" ]; then
            # Preview variables scoped to the staging branch: its API, NEXT_PUBLIC_ENVIRONMENT=staging.
            branch=(--git-branch=staging)
            alias="$STAGING_ALIAS"
          fi
          vercel() { pnpm dlx "$VERCEL_CLI" "$@" --token="$VERCEL_TOKEN"; }
          vercel pull --yes --environment="$target" "${branch[@]}"
          # NEXT_PUBLIC_API_URL is baked into the bundle and the CSP: without it the site would
          # silently call http://localhost:8080. It must be a Config (not Secret) variable.
          env_file=""
          for candidate in .vercel/.env."$target".local apps/web/.vercel/.env."$target".local; do
            if [ -z "$env_file" ] && [ -f "$candidate" ]; then env_file=$candidate; fi
          done
          api_url=$(sed -n 's/^NEXT_PUBLIC_API_URL=//p' "${env_file:-/dev/null}" | tr -d '"' | head -n 1)
          if [[ "$api_url" != https://* ]]; then
            echo "::error::Set NEXT_PUBLIC_API_URL (https://api.<domain>, type Config) for $target in the Vercel project."
            exit 1
          fi
          echo "API: $api_url"
          if [ "$STAGING" = "true" ]; then
            # Without the staging branch's own Preview variables the build would quietly use the
            # project-wide ones (the production API, no badge, indexable): refuse instead.
            environment=$(sed -n 's/^NEXT_PUBLIC_ENVIRONMENT=//p' "${env_file:-/dev/null}" | tr -d '"' | head -n 1)
            if [ "$environment" != staging ]; then
              echo "::error::Set NEXT_PUBLIC_ENVIRONMENT=staging and NEXT_PUBLIC_API_URL (the staging API) as Preview variables for the staging branch in Vercel (docs/deploy.md §11.5)."
              exit 1
            fi
          fi
          vercel build "${prod[@]}"
          # The deployment URL is the last line printed.
          url=$(vercel deploy --prebuilt "${prod[@]}" | tail -n 1)
          echo "Deployed ($target): $url" >> "$GITHUB_STEP_SUMMARY"
          if [ "$target" = preview ]; then
            if vercel alias set "$url" "$alias"; then
              echo "Preview: https://$alias" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$STAGING" = "true" ]; then
              echo "::error::Could not alias staging to $alias: add the domain to the Vercel project (docs/deploy.md §11)."
              exit 1
            else
              echo "::warning::Could not alias the preview to $alias (set the VERCEL_PREVIEW_ALIAS variable)."
            fi
          fi
