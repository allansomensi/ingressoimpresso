name: Backup

# ADRs 0013, 0019: daily logical dump of the production database, encrypted with age and kept as
# a workflow artifact for 30 days (Neon Free keeps only 6 hours of point-in-time history).
# Secrets: BACKUP_DATABASE_URL (direct Neon URL; a read-only role is enough) and
# BACKUP_AGE_RECIPIENT (public key from `age-keygen`; the private key stays in the password
# manager, never in GitHub). Monthly restore test: `just backup-restore-test` (docs/deploy.md).

on:
  schedule:
    # Every day at 06:17 UTC (03:17 in Brasília), away from events.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail: a failing pg_dump must fail the job, not upload an empty archive.
defaults:
  run:
    shell: bash

jobs:
  dump:
    name: pg_dump | age
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Backup secrets
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RECIPIENT" ]; then
            echo "::warning::Set BACKUP_DATABASE_URL and BACKUP_AGE_RECIPIENT (docs/deploy.md) to enable backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump and encrypt
        if: steps.secrets.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          name="ingressoimpresso-$(date -u +%Y%m%dT%H%MZ).dump.age"
          # The client matches the server (Postgres 18, like Neon); the plain dump never touches the disk.
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' \
            | age --recipient "$RECIPIENT" > "$name"
          size=$(stat -c %s "$name")
          echo "encrypted dump: $size bytes"
          # An empty database still dumps to several KB; less means pg_dump printed nothing.
          [ "$size" -gt 2048 ]

      - name: Keep the encrypted dump
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: ingressoimpresso-*.dump.age
          retention-days: 30
          if-no-files-found: error
