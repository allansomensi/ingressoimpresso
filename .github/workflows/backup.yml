name: Backup

# ADR 0013: weekly logical dump of the production database, encrypted with age and kept as a
# workflow artifact for 35 days; Neon's point-in-time restore covers the days in between.
# Secrets: BACKUP_DATABASE_URL (direct Neon URL; a read-only role is enough) and
# BACKUP_AGE_RECIPIENT (public key from `age-keygen`; the private key stays in the password
# manager, never in GitHub). Monthly restore test: `just backup-restore-test` (docs/deploy.md).

on:
  schedule:
    # Sundays 06:17 UTC (03:17 in Brasília), away from events.
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump | age
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Backup secrets
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RECIPIENT" ]; then
            echo "::warning::Set BACKUP_DATABASE_URL and BACKUP_AGE_RECIPIENT (docs/deploy.md) to enable backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump and encrypt
        if: steps.secrets.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          name="ingressoimpresso-$(date -u +%Y%m%dT%H%MZ).dump.age"
          # The client matches the server (Postgres 17); the plain dump never touches the disk.
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' \
            | age --recipient "$RECIPIENT" > "$name"
          test -s "$name"
          ls -l "$name"

      - name: Keep the encrypted dump
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: ingressoimpresso-*.dump.age
          retention-days: 35
          if-no-files-found: error
