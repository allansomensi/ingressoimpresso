name: CI

on:
  push:
    # staging: the test environment deploys only commits with green checks too (ADR 0046).
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one; on main and staging every
# run goes to the end, so a deploy or a release in progress is never cut halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"
  # Queries compile against the committed .sqlx cache (same as the Docker build)...
  SQLX_OFFLINE: "true"
  # ...and the sqlx::test suites run against the service below.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  check:
    name: just check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml (rustfmt, clippy, wasm32 target).
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install just and wasm-bindgen-cli
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # wasm-bindgen-cli must match the `wasm-bindgen` crate version pinned in Cargo.toml.
          tool: just,wasm-bindgen@0.2.129

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: just check
        run: just check

  # Phase 4 criterion: phones decide offline, then sync and converge (e2e/portaria.e2e.mjs), the
  # seller's page without network (vendedor.e2e.mjs) and the CSP (csp.e2e.mjs). Its own job, next
  # to `just check` instead of after it: the two no longer add up on the critical path.
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install just and wasm-bindgen-cli
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just,wasm-bindgen@0.2.129

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the door WASM
        run: just wasm

      # The browser download (~150 MB) is kept between runs; only its system libraries are
      # installed each time.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Door end-to-end test
        run: just e2e

      - name: Door e2e screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: door-e2e
          path: target/e2e/
          if-no-files-found: ignore

  # Known vulnerabilities in the locked dependencies (ADR 0047): the Rust tree against the RustSec
  # database, the JavaScript tree (what the site ships) against npm's advisories.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      # Vulnerabilities fail the job; unmaintained-crate notices only print. Known, unreachable
      # advisories are listed with their reasons in .cargo/audit.toml.
      - name: cargo audit
        run: cargo audit

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: pnpm audit
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --prod --audit-level=high

  # The site goes to Vercel only after every check above passed, on the branch that was pushed:
  # main is production, staging the test environment (ADR 0047; deploy-web.yml).
  deploy-web:
    name: Deploy web
    needs: [check, e2e, audit, api-image]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  # A version that reaches main becomes the tag vX.Y.Z and a GitHub Release with its notes from
  # CHANGELOG.md (ADR 0049), once the site went out: the tag marks what is in production. A push
  # that keeps the version (the tag exists) does nothing.
  release:
    name: Release
    needs: [deploy-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/release.mjs version)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already released; nothing to do."
            exit 0
          fi
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "Released [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

  # The image Render builds (deploy/api.Dockerfile), built and started here first: a broken
  # Dockerfile or a binary that does not start fails the PR instead of the production deploy.
  api-image:
    name: API image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build deploy/api.Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/api.Dockerfile
          tags: ingressoimpresso-api:ci
          load: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

      - name: Start the image against Postgres
        run: |
          docker run --detach --name api --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e TICKET_KEY_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            ingressoimpresso-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/readyz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          docker logs api

      - name: API logs
        if: failure()
        run: docker logs api || true
