[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
ticket-core = { path = "crates/ticket-core" }
ticket-render = { path = "crates/render" }

axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
# Same crypto provider as sqlx (ring): one TLS stack, no extra C build (aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit", "timeout", "catch-panic", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
curve25519-dalek = { version = "5.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.4.3", default-features = false }
form_urlencoded = "1.2.2"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.45.0"
qrcodegen = "1.8.0"
rqrr = "0.11.0"
# RSA signatures of Google ID tokens (ADR 0029); already in the tree through rustls and sqlx.
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
# Typst is pinned exactly: its API changes between minor versions (ADR 0008).
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"
uuid = { version = "1.27.0", default-features = false }
wasm-bindgen = "=0.2.129"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"

# Dev/test builds: our crates keep line tables only (backtraces), dependencies are optimized
# (Ed25519 property tests, Typst) without debug info. Full debug info for Typst & co. made
# target/ grow past 20 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
