# Local development database (the API arrives in phase 3). Production uses Neon (ADR 0013).
name: ingressoimpresso-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ingressoimpresso
      POSTGRES_PASSWORD: ingressoimpresso
      POSTGRES_DB: ingressoimpresso
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingressoimpresso"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
