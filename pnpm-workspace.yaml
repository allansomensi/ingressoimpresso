packages:
  - apps/*
  - packages/*

# Shared versions: reference with "catalog:" in package.json files.
catalog:
  "@eslint/js": 9.39.5
  "@types/node": 22.20.5
  eslint: 9.39.5
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  vitest: 5.0.3

# Install scripts are opt-in (pnpm 12: every package with a script needs a decision here).
# unrs-resolver ships prebuilt binaries; its postinstall only re-checks them.
allowBuilds:
  unrs-resolver: false
